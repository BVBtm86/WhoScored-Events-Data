
mongo:
  backup_folder: ./mongo_backup
  db: "WhoScored"
  url: "mongodb://localhost:27017/"
  collections:
    collection_teams: available_teams
    collection_schedule: game_schedule
    collection_lineups: game_lineups
    collection_formations: game_formations
    collection_logs: error_logs
    collection_raw_events: game_raw_events
    collection_processed_events: game_processed_events
    collection_team_game_stats: game_team_stats
    collection_player_game_stats: game_player_stats
    collection_shot_sequences: game_shot_sequences
    collection_pass_sequences: game_pass_sequences

season: 
  year: "2022-2023"
  year_short: "2223"
  league: "GER-Bundesliga"
  name: "Bundesliga"
  country: "Germany"

email:
  smtp_host: "smtp.gmail.com"
  smtp_port: 587
  use_tls: true

schedule_games:
  finished_status_code: 6
  required_columns: 
    - game_id
    - status
    - start_time
    - home_team_id
